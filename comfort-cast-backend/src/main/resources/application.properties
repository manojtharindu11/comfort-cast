spring.application.name=comfort-cast-backend
logging.level.org.manojtharindu11.comfortcastbackend=DEBUG
server.port=8080

openweathermap.api-key=${OPENWEATHERMAP_API_KEY}
openweathermap.base-url=https://api.openweathermap.org

spring.cache.type=caffeine
spring.cache.cache-names=rawWeather,weatherSummary
spring.cache.caffeine.spec=expireAfterWrite=300s
